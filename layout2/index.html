<style>
:root{
  --bg:#0d0c0a; --surface:#19160f; --ink:#f0ece2; --mute:#9c9586; --accent:#5b8cff; --tint:#a6c4ff; --deep:#12192b; --good:#6fcf97;
  --f-display:"Instrument Serif",Georgia,serif;
  --f-body:"Inter Tight","Helvetica Neue",Arial,sans-serif;
  --gx:5vw; --bar:64px; --top:calc(var(--bar) + 6vh + env(safe-area-inset-top,0px));
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;overflow-x:hidden;-webkit-font-smoothing:antialiased}
html.lenis,html.lenis body{height:auto}
.lenis.lenis-smooth{scroll-behavior:auto!important}
a{color:inherit}
::selection{background:var(--accent);color:#fff}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.disp{font-family:var(--f-display);font-weight:400;letter-spacing:-.005em}
h1,h2,h3,h4{margin:0;font-weight:400;text-wrap:balance}

.layer-back{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.stage{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
main{position:relative;z-index:3}

.j-year{position:absolute;left:25vw;bottom:3vh;transform:translateX(-50%);font-size:min(24vh,17vw);line-height:1;color:var(--tint);opacity:0;display:flex}
.odo{display:inline-flex;overflow:hidden;height:1em;line-height:1}
.odo .col{display:flex;flex-direction:column;transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.odo .col span{height:1em;display:block}
.contact-field{position:absolute;inset:0;background:var(--deep);clip-path:polygon(0 0,0 0,0 100%,0 100%)}
.lets{position:absolute;left:0;right:0;top:var(--top);text-align:center;color:#fff;font-size:min(28vh,19vw);line-height:.92;opacity:0}

/* ID badge rig: swings on a lanyard between pinned scenes */
.rig{position:absolute;left:0;top:0;width:var(--bw);transform-origin:50% 0;will-change:transform}
.strap{position:absolute;left:50%;bottom:calc(100% + 18px);width:26px;margin-left:-13px;height:200vh;background:var(--deep);box-shadow:inset 3px 0 0 rgba(255,255,255,.08),inset -3px 0 0 rgba(0,0,0,.15)}
.hook{position:absolute;left:50%;bottom:calc(100% - 4px);width:20px;height:24px;margin-left:-10px;z-index:3;border-radius:5px 5px 3px 3px;background:linear-gradient(90deg,#9aa6b1,#e5eaee 45%,#8d99a4)}
.hook i{position:absolute;left:50%;top:-14px;width:14px;height:16px;margin-left:-7px;border:3px solid #a9b4be;border-bottom:0;border-radius:8px 8px 0 0}
.badge{position:relative;width:var(--bw);height:calc(var(--bw)*1.42);transform-style:preserve-3d;will-change:transform}
.portrait{position:absolute;inset:0;margin:0;border-radius:calc(var(--bw)*.09);
  background:linear-gradient(155deg,rgba(255,255,255,.94),rgba(246,249,251,.88) 55%,rgba(226,234,241,.9));
  backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.9),inset 0 1px 0 rgba(255,255,255,1),0 24px 50px rgba(10,14,20,.45),0 2px 6px rgba(10,14,20,.2)}
.portrait::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(120deg,rgba(255,255,255,.55),rgba(255,255,255,0) 32%)}
.p-cap{position:absolute;left:0;right:0;top:calc(var(--bw)*.965);display:flex;flex-direction:column;align-items:center;text-align:center;gap:calc(var(--bw)*.018);padding:0 8%}
.p-name{font-size:calc(var(--bw)*.11);line-height:1;color:#1c2733}
.p-role{font:italic 500 calc(var(--bw)*.043)/1.25 var(--f-body);color:var(--accent)}
.p-stack{position:absolute;left:6%;right:6%;top:calc(var(--bw)*.06);height:calc(var(--bw)*.88);border-radius:calc(var(--bw)*.065);overflow:hidden;isolation:isolate;
  background:radial-gradient(120% 90% at 50% 30%,#f7f9fb,#dbe5ed 70%,#c9d7e3)}
.p-init{position:absolute;inset:0;display:grid;place-items:center;background:var(--accent);color:#fff;font-size:calc(var(--bw)*.34)}
.avatar{display:none}

/* sections */
.sec{position:relative}
.pin{position:sticky;top:0;height:100vh;height:100lvh}
.inner{position:absolute;inset:0;overflow:hidden}
.abs{position:absolute}
.h2{font-family:var(--f-display);font-size:clamp(40px,4.6vw,88px);line-height:1}

/* hero */
.hero-copy{left:var(--gx);top:calc(var(--bar) + 2px + env(safe-area-inset-top,0px));width:min(58vw,880px)}
.hero-big{font-family:var(--f-display);font-size:clamp(60px,min(9vw,15vh),180px);line-height:.88;color:var(--tint);white-space:nowrap;margin:0 0 .12em -.03em}
.hero-big .hn-first{display:block;font-size:.27em;line-height:1.1;color:var(--ink);margin:0 0 .42em .1em;letter-spacing:.01em}
.logo{transition:color .4s,opacity .35s;text-decoration:none}
body.at-top .logo{opacity:0;pointer-events:none}
body.at-top:not(.on-dark) .hud{background:transparent}
.hero-big span{display:inline-block;will-change:transform}
.hi{margin:0 0 .5vh;font-size:clamp(17px,1.5vw,24px);font-weight:500;color:var(--mute)}
.title{font-family:var(--f-display);font-size:clamp(34px,min(5.4vw,9.5vh),88px);line-height:1;color:var(--ink)}
.title .ln{display:block;overflow:hidden;padding-bottom:.06em}
.title .ln>span{display:block}
.desc{max-width:36em;font-size:clamp(17px,1.3vw,21px);line-height:1.5;margin:3vh 0 3.4vh;color:var(--mute)}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;height:54px;padding:0 26px;border-radius:999px;font-weight:600;font-size:16px;text-decoration:none;cursor:pointer;border:0;background:var(--accent);color:#fff;transition:background .25s,transform .15s;position:relative;overflow:hidden;isolation:isolate}
.btn::before{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--deep);transform:translateY(101%);transition:transform .5s cubic-bezier(.7,0,.2,1);z-index:-1}
.btn:hover::before{transform:none}
.btn.alt::before,.nav .btn.rvb::before,body.on-dark .nav .btn::before{background:var(--tint)}
.rl{display:inline-block;overflow:hidden;height:1.3em;line-height:1.3em;vertical-align:middle}
.rl>span{display:block;transition:transform .5s cubic-bezier(.7,0,.2,1)}
.rl>span::after{content:attr(data-t);display:block}
.btn:hover .rl>span{transform:translateY(-50%)}
.btn:active{transform:translateY(1px)}
.btn.alt{background:var(--surface);color:var(--ink)}

/* about */
.about-col{left:46vw;right:var(--gx);top:calc(var(--bar) + 3vh + env(safe-area-inset-top,0px));bottom:6vh;display:flex;flex-direction:column;justify-content:space-between;gap:28px}
.statement{font-size:clamp(22px,2vw,32px);font-weight:600;letter-spacing:-.02em;line-height:1.18;margin:0;max-width:24em}
.statement .w{display:inline-block;will-change:transform,opacity}
.about-col .more{font-size:clamp(16px,1.15vw,19px);line-height:1.55;max-width:38em;margin:2.2vh 0 0;color:var(--mute)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;perspective:900px}
.stat{transition:transform .5s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.stat .num{font-family:var(--f-display);font-size:clamp(48px,4.8vw,92px);line-height:1;display:flex;color:var(--ink)}
.stat .num .suf{color:var(--accent)}
.stat p{margin:8px 0 0;font-size:16px;line-height:1.35;max-width:14em;color:var(--mute)}

/* work */
.work-head{left:var(--gx);right:var(--gx);top:calc(var(--bar) + 2.5vh + env(safe-area-inset-top,0px));display:flex;align-items:flex-end;gap:32px}
.wbar{width:160px;height:6px;background:var(--surface);border-radius:3px;position:relative;margin-bottom:.9em;overflow:hidden}
.wbar i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--accent)}
.deck{left:var(--gx);top:calc(var(--bar) + 2.5vh + clamp(40px,4.6vw,88px) + 16px + env(safe-area-inset-top,0px));width:min(70vw,1100px);height:70vh;perspective:1500px}
.card{position:absolute;inset:0 0 auto 0;background:var(--surface);border-radius:4px;display:grid;grid-template-columns:1.45fr .55fr;align-items:start;gap:16px 36px;padding:clamp(18px,2.2vw,34px);will-change:transform,opacity;transform-origin:50% 100%;--cp:clamp(18px,2.2vw,34px)}
.card .info{display:flex;flex-direction:column;min-width:0}
.card>*{min-width:0}
.card h3{font-family:var(--f-display);font-size:clamp(30px,3vw,56px);line-height:1;margin:10px 0 12px;color:var(--ink)}
.card p{margin:0 0 10px;font-size:clamp(16px,1.15vw,19px);line-height:1.5;max-width:36em;color:var(--mute)}
.card .tools{font-size:14px;color:var(--mute);margin:0;line-height:1.45}
.card .org{font-size:15px;font-weight:600;color:var(--accent);margin-top:18px}

.tk-top{grid-column:1/-1;display:flex;align-items:center;gap:10px;margin:calc(var(--cp)*-1) calc(var(--cp)*-1) 0;padding:12px var(--cp);background:rgba(255,255,255,.05);border-radius:4px 4px 0 0;font-size:14px;color:var(--mute)}
.tk-crumb{display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:wrap}
.tk-crumb i{font-style:normal;opacity:.6}
.tk-key{color:var(--accent);font-weight:700;letter-spacing:.02em}
.tk-ic{width:18px;height:18px;border-radius:4px;background:var(--accent);position:relative;flex:none;display:inline-block}
.tk-ic::after{content:"";position:absolute;left:5px;top:4px;width:8px;height:10px;background:#fff;clip-path:polygon(0 0,100% 0,100% 100%,50% 72%,0 100%)}
.tk-ic.sm{width:14px;height:14px;border-radius:3px;margin-right:6px;vertical-align:-2px}
.tk-ic.sm::after{left:4px;top:3px;width:6px;height:8px}
.tk-type{display:block;font-size:14px;color:var(--mute);margin:-4px 0 10px}
.tk-st{margin-left:auto;font-weight:700;font-size:12px;letter-spacing:.03em;text-transform:uppercase;padding:4px 10px;border-radius:3px;white-space:nowrap}
.tk-st.done{background:rgba(111,207,151,.16);color:var(--good)}
.tk-st.prog{background:rgba(91,140,255,.18);color:var(--accent)}
.tk-h{display:block;font-size:13px;font-weight:700;color:var(--mute);margin:4px 0 6px}
.pts{margin:4px 0 0;list-style:none;padding-left:0;display:flex;flex-direction:column;gap:8px;font-size:clamp(15px,1.05vw,18px);line-height:1.45;max-width:36em;color:var(--mute)}
.pts li{position:relative;padding-left:1.5em}
.pts li::before{content:"\2713\FE0E";position:absolute;left:0;top:0;color:var(--good);font-weight:700}
.tk-foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px;font-size:14px;color:var(--mute)}
.tk-foot b{color:var(--ink);font-weight:600}
.tk-av{width:26px;height:26px;border-radius:50%;overflow:hidden;background:var(--accent);color:#fff;display:inline-grid;place-items:center;font:700 11px var(--f-body);flex:none}
.tk-org{font-weight:600;color:var(--accent)}
.facts{display:grid;grid-template-columns:1fr;align-content:start;gap:18px;background:var(--bg);padding:clamp(18px,2vw,30px);border-radius:3px;min-width:0}
.facts .tk-h{margin:0}
.facts .tk-tools{margin-top:4px}
.facts .tk-tools .tk-h{margin:0 0 4px}
.fact .n{font-family:var(--f-display);font-size:clamp(36px,3.2vw,60px);line-height:1;color:var(--accent)}
.fact .n.word{font-size:clamp(22px,2vw,34px);line-height:1.05}
.card .fact p{margin:6px 0 0;font-size:clamp(14px,1vw,16px);line-height:1.35;color:var(--ink)}

/* work card mini-visuals */
.vis{grid-column:1/-1;height:clamp(56px,8.5vh,84px);border-radius:3px;background:var(--accent);position:relative;overflow:hidden;color:#fff;margin-bottom:4px}
.vis .vl{position:absolute;left:14px;top:10px;font-size:13px;font-weight:600;opacity:.9;z-index:1}
.lanes{position:absolute;left:118px;right:12px;top:8px;bottom:8px;display:grid;grid-template-rows:repeat(3,1fr);gap:4px}
.lane{border-radius:4px;background:rgba(255,255,255,.14);display:flex;align-items:center;overflow:hidden}
.lane .trk{position:relative;flex:1;align-self:stretch;overflow:hidden;border-left:1px solid rgba(255,255,255,.25)}
.lane b{flex:none;width:118px;padding-left:8px;font-size:11px;font-weight:600;opacity:.95;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lane i{position:absolute;top:20%;height:60%;width:12%;border-radius:4px;background:#fff;animation:tix 7s linear infinite}
.lane i:nth-child(2){animation-delay:-2.3s;width:8%}.lane i:nth-child(3){animation-delay:-4.6s;width:14%}
.lane:nth-child(2) i{animation-duration:8.5s}.lane:nth-child(3) i{animation-duration:6s}
@keyframes tix{from{left:-12%}to{left:104%}}
.pipeln{position:absolute;left:150px;right:12px;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:0}
.pst{flex:1 1 0;min-width:0;background:rgba(255,255,255,.16);color:#fff;border-radius:8px;padding:7px 10px;display:flex;flex-direction:column;gap:1px;animation:pstOn 6s ease-in-out infinite;animation-delay:calc(var(--k) * 1.2s)}
.pst b{font-family:var(--f-display);font-weight:400;font-size:clamp(14px,1.2vw,19px);line-height:1}
.pst small{font-size:11px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@keyframes pstOn{0%,100%{background:rgba(255,255,255,.16);color:#fff}8%,22%{background:#fff;color:var(--accent)}30%{background:rgba(255,255,255,.16);color:#fff}}
.plink{flex:0 0 26px;height:2px;background:rgba(255,255,255,.35);position:relative}
.plink i{position:absolute;top:-3px;width:8px;height:8px;border-radius:50%;background:#fff;animation:pipe 1.6s linear infinite}
.plink i:nth-child(2){animation-delay:-.8s}
.g36{position:absolute;left:150px;right:120px;top:12px;bottom:12px;display:grid;grid-template-rows:repeat(2,1fr);gap:5px}
.g36 i{border-radius:3px;background:rgba(255,255,255,.2);animation:lit 6s ease-in-out infinite}
@keyframes lit{0%,8%{background:rgba(255,255,255,.2)}18%,80%{background:#fff}100%{background:rgba(255,255,255,.2)}}
.vis .vb{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-family:var(--f-display);font-size:clamp(20px,1.8vw,30px)}
.flow{position:absolute;left:150px;right:14px;top:10px;bottom:10px;display:flex;align-items:center;gap:14px}
.node{flex:none;height:100%;padding:0 18px;border-radius:4px;background:#fff;color:var(--accent);display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-size:clamp(16px,1.4vw,24px)}
.node small{font-family:var(--f-body);font-size:12px;font-weight:600;color:var(--mute)}
.pipe{flex:1;height:3px;background:rgba(255,255,255,.35);position:relative;border-radius:2px}
.pipe i{position:absolute;top:-4px;width:11px;height:11px;border-radius:50%;background:#fff;animation:pipe 2.6s linear infinite}
.pipe i:nth-child(2){animation-delay:-.87s}.pipe i:nth-child(3){animation-delay:-1.73s}
@keyframes pipe{from{left:-3%}to{left:100%}}
.bub{position:absolute;left:150px;right:14px;top:50%;transform:translateY(-50%);display:flex;gap:8px;align-items:center}
.bub span{flex:1;min-width:0;background:#fff;color:#1c2733;border-radius:12px 12px 12px 3px;padding:8px 10px;font-size:12.5px;font-weight:500;line-height:1.3;animation:pop 8s ease-out infinite;opacity:0}
.bub span:nth-child(even){background:var(--deep);color:#fff;border-radius:12px 12px 3px 12px}
.bub span:nth-child(2){animation-delay:1.2s}.bub span:nth-child(3){animation-delay:2.4s}.bub span:nth-child(4){animation-delay:3.6s}
@keyframes pop{0%{opacity:0;transform:translateY(8px)}6%,85%{opacity:1;transform:none}100%{opacity:0}}

/* career */
.j-col{left:50vw;right:var(--gx);top:var(--top);bottom:6vh;display:flex;flex-direction:column}
.j-col .h2{margin-bottom:4vh}
.tl{display:flex;flex-direction:column;justify-content:flex-start;gap:clamp(20px,3.6vh,40px);perspective:900px;list-style:none;margin:0;padding:0}
.ti{display:grid;grid-template-columns:4.2em 1fr;gap:16px;align-items:baseline;transform-origin:0 50%;will-change:transform,opacity}
.ti .yr{font-family:var(--f-display);font-size:clamp(18px,1.5vw,26px);color:var(--accent)}
.ti h4{font-family:var(--f-display);font-size:clamp(19px,1.6vw,28px);line-height:1.05;color:var(--mute);transition:color .3s}
.ti.on h4{color:var(--ink)}
.ti .o{font-size:15px;color:var(--mute)}

/* toolkit */
.sk-col{left:var(--gx);top:calc(var(--bar) + env(safe-area-inset-top,0px));bottom:15vh;width:min(56vw,900px);display:flex;flex-direction:column;justify-content:center}
.sk-col .h2{margin-bottom:4vh}
.groups{display:flex;flex-direction:column;gap:clamp(10px,1.8vh,18px)}
.grp{display:flex;align-items:center;gap:14px;align-self:stretch;max-width:100%;background:var(--surface);border-radius:28px;padding:10px 22px 10px 10px;transition:transform .25s,box-shadow .25s}
.grp:hover{transform:translateX(6px)}
.grp .gl{flex:none;width:6.2em;text-align:center;background:var(--accent);color:#fff;font-family:var(--f-display);font-size:clamp(16px,1.3vw,22px);line-height:1;padding:8px 0;border-radius:999px}
.grp .gs{font:500 clamp(12.5px,.95vw,16px)/1.4 var(--f-body);color:var(--ink);min-width:0}
.grp .gs i{font-style:normal;color:var(--tint);margin:0 .5em}
.tape{left:var(--gx);right:var(--gx);bottom:5vh;display:flex;align-items:center;gap:14px;flex-wrap:nowrap}
.tape .lbl{font:600 14px var(--f-body);color:var(--mute);white-space:nowrap}
.flaps{display:flex;gap:8px;flex:1;min-width:0;perspective:600px}
.flap{position:relative;flex:1;min-width:0;height:clamp(44px,7vh,64px);border-radius:6px;background:var(--deep);color:#fff;font-family:var(--f-display);font-size:clamp(16px,1.6vw,26px);overflow:hidden}
.flap .fc{position:absolute;inset:0;display:grid;place-items:center;padding:0 8px;white-space:nowrap;text-overflow:ellipsis;backface-visibility:hidden;transform-origin:50% 50%}
.flap .fc.in{animation:flipIn .5s cubic-bezier(.3,.7,.3,1) both}
.flap .fc.out{animation:flipOut .5s cubic-bezier(.7,0,.7,.3) both}
@keyframes flipIn{from{transform:rotateX(90deg);opacity:.2}to{transform:none;opacity:1}}
@keyframes flipOut{from{transform:none}to{transform:rotateX(-90deg);opacity:.2}}
.layer-front{position:fixed;inset:0;z-index:2;pointer-events:none;overflow:hidden}
.chip-o{position:absolute;left:0;top:0;font:600 clamp(12.5px,.92vw,15.5px)/1.1 var(--f-body);letter-spacing:.01em;padding:.55em 1.05em;border-radius:999px;white-space:nowrap;will-change:transform,opacity;opacity:0;backdrop-filter:blur(8px) saturate(1.3);-webkit-backdrop-filter:blur(8px) saturate(1.3);transform:translate3d(-999px,-999px,0)}
.layer-back .chip-o{color:#1c2733;background:rgba(255,255,255,.5)}
.layer-back .chip-o.solid{color:var(--deep);background:rgba(166,196,255,.55)}
.layer-front .chip-o{color:#1c2733;background:rgba(255,255,255,.62);box-shadow:inset 0 0 0 2px rgba(91,140,255,.25),0 10px 26px rgba(10,14,20,.3)}

  $$("#heroName .l").forEach((sp, i) => { if (introDone) sp.style.transform = `translateY(${(i % 2 ? 1 : -1) * H.p * 16}px)`; });

  const pm = clamp(.2 * A.enter + A.p * 1.4); const K2 = words.length;
  words.forEach((w, k) => { const wv = reduce ? 1 : clamp(pm * (K2 + 3) - k); w.style.opacity = .1 + .9 * wv; w.style.transform = `translateY(${(1 - wv) * .25}em)`; w.style.filter = wv >= 1 ? "none" : `blur(${(1 - wv) * 4}px)`; });
  statOdos.forEach((s, i) => s.o.set(s.n * eOC(clamp(A.p * 2.2 + A.enter * .4 - .4 - i * .1))));

  const N = cards.length; const raw = W.p * (N - 1) * 1.08; const ii = Math.min(N - 1, Math.floor(raw)); const q = ii + eIO(clamp(raw - ii));
  const de = eOC(clamp(W.enter * 1.3 - .2));
  $("#deck").style.transform = `translateY(${(1 - de) * 26}vh) rotateY(${(1 - de) * -25}deg)`;
  cards.forEach((c, j) => {
    const d = j - q; let tz, ty, rx = 0, op;
    if (d >= 0) { tz = -d * 300; ty = d * 3.2; op = d <= 1 ? 1 : clamp((1.5 - d) * 2); }
    else { const a = -d; tz = a * 900; ty = -12 * a; rx = 28 * a; op = clamp(1 - a * 2.6); }
    c.style.transform = `translate3d(0,${ty}vh,${tz}px) rotateX(${rx}deg)`;
    c.style.opacity = op * Math.max(0, 1 - W.exit * 2.4);
    c.style.zIndex = String(100 - Math.round(d * 10));
    c.style.pointerEvents = Math.abs(d) < .5 ? "auto" : "none";
  });
  $("#wBar").style.width = (W.p * 100) + "%";

  $("#jYear").style.opacity = J.vis * (mob ? .25 : 1);
  yOdo.set(DATA.yearFrom + (DATA.yearTo - DATA.yearFrom) * clamp(J.p * 1.2));
  const jp = clamp(.3 * J.enter + J.p * 1.05); const NJ = tItems.length;
  tItems.forEach((it, k) => {
    const fb = NJ - 1 - k; const r = reduce ? 1 : eIO(clamp((jp * (NJ + 2) - fb) / 1.8));
    it.style.opacity = r * Math.max(0, 1 - J.exit * 2.4);
    it.style.transform = `rotateY(${(1 - r) * -55}deg) translateY(${(1 - r) * 16}px)`;
    it.classList.toggle("on", Math.min(NJ - 1, Math.floor(jp * NJ)) === fb && r > .9);
  });

  const rows = (list, s) => list.forEach((el, i) => { const r = reduce ? 1 : eOC(clamp(s.enter * 1.7 - .45 - i * .09 + s.p * .6)); el.style.opacity = r * Math.max(0, 1 - s.exit * 2.4); el.style.transform = `translateY(${(1 - r) * 24}px)`; });
  rows(grps, K); rows(certRows, C);

  const ov = mob ? 0 : K.vis, tt = performance.now() / 1000;
  if (ov > .001) {
    const cx = X * vw + smx * 14, cyy = cyv * vh + smy * 14, bwS = bw * sc, bhS = bh * sc;
    const room = Math.min(cx - (skRight + 40), vw - 24 - cx) - 64;
    const rxA = Math.max(bwS * .78, Math.min(bwS * 1.3, room));
    const ryA = bhS * .72, spin = tt * .16 + K.p * Math.PI * 1.4;
    orbit.forEach((o, i) => {
      const dir = o.ring ? -1 : 1, rx = rxA * (o.ring ? .92 : 1), ry = ryA * (o.ring ? 1.12 : 1);
      const a = o.a0 + spin * dir * (o.ring ? .85 : 1);
      const depth = Math.sin(a) * dir;
      const drift = Math.sin(tt * .9 + o.ph + K.p * 5) * 9;
      let x = cx + Math.cos(a) * (rx + drift);
      let y2 = cyy + Math.sin(a) * ry + Math.cos(tt * 1.3 + o.ph * 1.7 + K.p * 7) * 7;
      const pw = bw * sc, fx = cx - pw * .035, fy = cyy - pw * .24, ex = pw * .26 + 64, ey = pw * .34 + 22;
      const nx = (x - fx) / ex, ny = (y2 - fy) / ey, dd = Math.hypot(nx, ny);
      if (dd < 1) { const f = 1 / Math.max(dd, .001); x = fx + nx * ex * f; y2 = fy + ny * ey * f; }
      const sz = .82 + .18 * (depth + 1) / 2;
      const rv2 = reduce ? 1 : eOC(clamp(K.enter * 1.7 - .45 - i * .03));
      const near = depth > .3, on = near ? o.f : o.b, off = near ? o.b : o.f;
      off.style.opacity = 0;
      on.style.transform = `translate3d(${x}px,${y2}px,0) translate(-50%,-50%) scale(${sz})`;
      on.style.opacity = ov * rv2 * (near ? 1 : .55 + .35 * (depth + 1));
    });
  } else orbit.forEach(o => { o.b.style.opacity = 0; o.f.style.opacity = 0; });

  const nf = fanCards.length, spread = reduce ? 1 : eOC(clamp(C.enter * 1.5 - .4 + C.p * .8)), fnow = performance.now();
  const stepX = mob ? 70 : Math.min(150, vw * .1), peek = mob ? 14 : 20;
  if (nf > 1 && C.vis > .3 && !reduce && fnow - fanLast > 3200) shuffle(1);
  fanCards.forEach((el, k) => {
    const rel = (k - fanOff + nf) % nf, st = fanState[k];
    let tx, ty, rot, scv, op, z, f = .14;
    const side = rel % 2 ? -1 : 1, d = Math.min(rel, 4);
    tx = side * d * peek * spread; ty = -d * peek * .55 * spread; rot = side * d * 3.2 * spread; scv = 1 - d * .055; op = rel > 4 ? 0 : 1 - d * .08; z = 50 - rel;
    const age = fnow - st.out;
    if (age < 520) {
      const p = age / 520, e = Math.sin(p * Math.PI);
      tx = st.dir * stepX * 1.9 * e + tx * (1 - e); ty = -40 * e + ty * (1 - e); rot = st.dir * 16 * e + rot * (1 - e);
      scv = 1 - .04 * e; op = 1; z = p < .5 ? 60 : z; f = .3;
    }
    st.tx = lerp(st.tx, tx, f); st.ty = lerp(st.ty, ty, f); st.r = lerp(st.r, rot, f); st.s = lerp(st.s, scv, f); st.o = lerp(st.o, op, .14);
    const bob = rel === 0 ? Math.sin(fnow / 1000 * 1.2) * 3 * spread : 0;
    el.style.transform = `translate3d(${st.tx.toFixed(1)}px,${(st.ty + bob).toFixed(1)}px,0) rotate(${st.r.toFixed(2)}deg) scale(${st.s.toFixed(3)})`;
    el.style.opacity = st.o.toFixed(3); el.style.zIndex = String(z);
  });

  const tc = eIOS(clamp((y - (T.top - lead)) / span));
  const skew = .2 * vh, e2 = -skew + (vw + 2 * skew) * tc;
  contactField.style.clipPath = tc >= 1 ? "none" : `polygon(0 0, ${e2 + skew}px 0, ${e2 - skew}px ${vh}px, 0 ${vh}px)`;
  const po = 1 - eOC(clamp(tc * 1.5)); rig.style.opacity = po.toFixed(3); rig.style.pointerEvents = po < .05 ? "none" : "auto";
  const lt = eOC(clamp((tc - .5) * 2)); lets.style.opacity = lt; lets.style.transform = `translateY(${(1 - lt) * 50}px)`;
  document.body.classList.toggle("on-dark", tc > .6);
  document.body.classList.toggle("at-top", H.exit < .35);
}

let introDone = false;
if (window.gsap) { gsap.ticker.lagSmoothing(0); gsap.ticker.add(time => { if (lenis) lenis.raf(time * 1000); tick(); }); }
else (function loop() { tick(); requestAnimationFrame(loop); })();

if (matchMedia("(pointer:fine)").matches && !reduce) $$(".stat").forEach(c => {
  c.addEventListener("pointermove", e => { const r = c.getBoundingClientRect(); const x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5; c.style.transform = `rotateY(${x * 28}deg) rotateX(${-y * 28}deg)`; });
  c.addEventListener("pointerleave", () => { c.style.transform = ""; });
});
$$(".btn").forEach(b => { if (b.children.length || !b.textContent.trim()) return; const t = b.textContent; b.textContent = ""; const w = h("span", "rl"), s = h("span", ""); s.textContent = t; s.dataset.t = t; w.appendChild(s); b.appendChild(w); b.setAttribute("aria-label", t.trim()); });
if (window.gsap && matchMedia("(pointer:fine)").matches && !reduce) $$(".btn").forEach(b => {
  const qx = gsap.quickTo(b, "x", { duration: .7, ease: "elastic.out(1,.45)" }), qy = gsap.quickTo(b, "y", { duration: .7, ease: "elastic.out(1,.45)" });
  b.addEventListener("pointermove", e => { const r = b.getBoundingClientRect(); qx((e.clientX - r.left - r.width / 2) * .35); qy((e.clientY - r.top - r.height / 2) * .35); });
  b.addEventListener("pointerleave", () => { qx(0); qy(0); });
});

function intro() {
  setTimeout(() => { introDone = true; }, reduce ? 0 : 2300);
  if (!window.gsap || reduce) return;
  gsap.from("#heroName .l", { yPercent: 115, rotateX: -80, opacity: 0, stagger: .07, duration: 1.6, ease: "expo.out", transformOrigin: "50% 100%" });
  gsap.from(".title .ln > span", { yPercent: 105, stagger: .1, duration: 1.1, ease: "expo.out", delay: .15 });
  gsap.from("#portrait", { y: 60, opacity: 0, scale: .94, duration: 1.6, ease: "expo.out", delay: .25 });
}
const pre = $("#pre");
if (lenis) lenis.stop();
const fontsReady = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
Promise.race([Promise.all([fontsReady, new Promise(r => setTimeout(r, 900))]), new Promise(r => setTimeout(r, 2200))]).then(() => {
  measure(); if (lenis) lenis.start();
  if (!window.gsap || reduce) { pre.remove(); intro(); return; }
  gsap.timeline({ onComplete: () => pre.remove() })
    .to(".pre .mid", { opacity: 0, y: -40, duration: .4, ease: "power2.in" })
    .to(".pre .t", { yPercent: -100, duration: 1.2, ease: "expo.inOut" }, "-=.05")
    .to(".pre .b", { yPercent: 100, duration: 1.2, ease: "expo.inOut" }, "<")
    .add(intro, "-=.75");
});
</script>
